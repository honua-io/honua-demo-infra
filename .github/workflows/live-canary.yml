name: live demo canary

on:
  schedule:
    - cron: "17 */6 * * *"
  repository_dispatch:
    types: [demo-deployed]
  workflow_dispatch:
    inputs:
      deployment_revision:
        description: "Exact server commit expected from the deployed capability manifest"
        required: false
        type: string
      wms_admission:
        description: "Probe live WMS, or planned WMS during an approved promotion"
        required: true
        default: live
        type: choice
        options:
          - live
          - planned
  push:
    branches: [trunk]
    paths:
      - "manifest/**"
      - "scripts/live-demo-canary.mjs"
      - "scripts/test-stac-live-contract.mjs"
      - "scripts/test-wms-live-contract.mjs"
      - "scripts/client-compat-canary.mjs"
      - "stacks/aws/client-compat-seed.v1.json"
      - ".github/workflows/live-canary.yml"

permissions:
  contents: read

concurrency:
  group: live-demo-canary
  cancel-in-progress: false

jobs:
  public-aws-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Probe every published demo service family
        env:
          HONUA_DEMO_EXPECTED_DEPLOYMENT_REVISION: ${{ inputs.deployment_revision || github.event.client_payload.deployment_revision || '' }}
          HONUA_DEMO_WMS_ADMISSION: ${{ inputs.wms_admission || 'live' }}
          HONUA_DEMO_WMS_SERVER_IMAGE_DIGEST: ${{ vars.HONUA_DEMO_WMS_SERVER_IMAGE_DIGEST }}
          HONUA_DEMO_WMS_SERVER_COMMIT: ${{ vars.HONUA_DEMO_WMS_SERVER_COMMIT }}
          HONUA_DEMO_WMS_SERVER_ARCHITECTURE: ${{ vars.HONUA_DEMO_WMS_SERVER_ARCHITECTURE }}
        run: node scripts/live-demo-canary.mjs

      - name: Prove protected client-compat behavior
        env:
          HONUA_CLIENT_COMPAT_API_KEY: ${{ secrets.HONUA_CLIENT_COMPAT_API_KEY }}
          HONUA_CLIENT_COMPAT_SERVER_COMMIT: ${{ vars.HONUA_CLIENT_COMPAT_SERVER_COMMIT }}
          HONUA_CLIENT_COMPAT_SERVER_IMAGE: ${{ vars.HONUA_CLIENT_COMPAT_SERVER_IMAGE }}
        run: node scripts/client-compat-canary.mjs

      - name: Upload live canary evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: live-demo-canary
          path: .artifacts
          if-no-files-found: error
          include-hidden-files: true
