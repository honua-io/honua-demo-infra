name: Manifest Drift

# Regenerates manifest/demo-services.v1.json from the seed definitions
# (stacks/aws/SEED_MANIFEST.md + the pinned honua-server STAC seed referenced
# from README.md) and fails when the committed manifest is stale (#19).
#
# This keeps the manifest generated-only: any change to the seeds without a
# matching `python3 manifest/generate-demo-services.py` run fails here, and
# any hand edit to the manifest itself fails here too.
#
# Needs network egress to raw.githubusercontent.com (public, pinned ref) —
# nothing else. No AWS credentials, read-only.

on:
  pull_request: {}
  push:
    branches: [trunk]

permissions:
  contents: read

concurrency:
  group: manifest-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest-drift:
    name: demo-services.v1.json matches seed definitions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Regenerate manifest and fail on drift
        run: python3 manifest/generate-demo-services.py --check

      - name: Validate protected client-compat descriptor and canary
        run: |
          python3 manifest/generate-client-compat.py --check
          node --test scripts/test-client-compat-canary.mjs

      - name: Validate planned WMS release and semantic canary
        run: node --test scripts/test-wms-live-contract.mjs

      - name: Validate STAC deployment semantic canary
        run: node --test scripts/test-stac-live-contract.mjs

      - name: Validate edge-generated root response contract
        # `GET /` is generated by the CloudFront viewer-request function in
        # stacks/aws/cloudfront.tf, so it bypasses honua-server's security
        # headers entirely. Pin that header set here (honua-release#87).
        run: node --test scripts/test-edge-root-response.mjs

      - name: Validate in-VPC STAC seed renderer
        run: |
          python3 scripts/test-render-demo-stac-seed.py
          python3 scripts/test-stac-seed-handler.py
          python3 scripts/test-stac-runbook-contract.py

      - name: Validate credential-safe candidate preflight
        run: |
          python3 scripts/test-candidate-preflight-handler.py
          python3 scripts/test-candidate-preflight-ecr.py
          python3 scripts/test-candidate-preflight-contract.py
          python3 scripts/test-candidate-preflight-invocation.py
          python3 scripts/test-candidate-preflight-governance-receipt.py
          python3 scripts/test-candidate-preflight-v2-governance.py
          python3 scripts/test-candidate-preflight-v2-runtime.py
          python3 scripts/test-candidate-preflight-v2-invocation.py
          python3 scripts/test-candidate-preflight-v3-governance.py
          python3 scripts/test-candidate-preflight-v3-runtime.py
          python3 scripts/test-candidate-preflight-v3-invocation.py
          python3 scripts/test-candidate-preflight-archive-materialization.py
          bash scripts/test-candidate-preflight-operator-flow.sh
          bash scripts/test-candidate-preflight-v2-operator-flow.sh
          bash scripts/test-candidate-preflight-v3-operator-flow.sh

      - name: Validate governed database migration runner
        run: |
          python3 stacks/aws-db-migration-runner/runner/build.py --source stacks/aws-db-migration-runner/runner --output "$RUNNER_TEMP/runner-a.zip"
          python3 stacks/aws-db-migration-runner/runner/build.py --source stacks/aws-db-migration-runner/runner --output "$RUNNER_TEMP/runner-b.zip"
          cmp "$RUNNER_TEMP/runner-a.zip" "$RUNNER_TEMP/runner-b.zip"
          printf '%s  %s\n' 'ec7b6775eb02cf37a73bd7053e6da2a524be343b7785e6384b43b3a708b2c79a' "$RUNNER_TEMP/runner-a.zip" | sha256sum --check --strict
          python3 scripts/assert-db-migration-runner-source.py
          python3 scripts/test-db-migration-runner.py
          python3 scripts/test-db-migration-governance.py

  terraform-contract:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Validate Terraform root and private-module interface
        run: python3 scripts/validate-terraform-root.py

      - name: Validate isolated candidate plan and runtime contracts
        run: |
          python3 scripts/test-candidate-preflight-tag-map.py
          python3 scripts/test-candidate-preflight-plan-isolation.py
          python3 scripts/test-candidate-preflight-postapply.py
          python3 scripts/test-candidate-preflight-plan-receipt.py
          python3 scripts/test-candidate-preflight-runtime-audit.py
