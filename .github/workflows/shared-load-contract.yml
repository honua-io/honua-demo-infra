name: Shared load contract

on:
  pull_request:
    paths:
      - .github/workflows/load-demo-dataset.yml
      - .github/workflows/shared-load-contract.yml
      - scripts/shared-load-workflow.py
      - scripts/test-shared-load-workflow.py

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 scripts/test-shared-load-workflow.py
